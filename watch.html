<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Watch – Subscription Search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo"></span>Subscription Search</a>
    <nav>
      <a href="index.html">Browse</a>
      <a href="settings.html">Settings &amp; channels</a>
    </nav>
  </header>

  <main class="watch">
    <div class="player-wrap"><div id="player"></div></div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <span id="statusText" class="meta"></span>
      <span style="flex:1"></span>
      <button class="btn" id="finishBtn">✓ Mark finished</button>
      <button class="btn" id="resetBtn">↺ Mark unwatched</button>
      <a class="btn" id="ytLink" target="_blank" rel="noopener">Open on YouTube ↗</a>
    </div>
    <div class="desc" id="desc" hidden></div>
  </main>

  <script type="module" src="js/watch.js"></script>
</body>
</html>
